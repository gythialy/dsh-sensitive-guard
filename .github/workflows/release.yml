name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish npm, GitHub Packages, and release assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Check release tag matches package version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="${{ github.event.release.tag_name }}"
          if [ "v${version}" != "${tag}" ]; then
            echo "::error::release tag ${tag} does not match package version v${version}"
            exit 1
          fi

      - name: Publish npmjs
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN is not configured; skipping npmjs publication"
            exit 0
          fi
          config="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" >> "${config}"
          npm publish --registry https://registry.npmjs.org --access public --provenance

      - name: Publish GitHub Packages mirror
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GitHub Packages requires the package scope to match the repository
          # owner, so this mirror is published as @gythialy/... while npmjs and
          # every other channel use the canonical @r0cky20/... name. The rename
          # is local to this step; package.json is restored either way.
          trap 'git checkout -- package.json' EXIT
          npm pkg set name=@gythialy/dsh-sensitive-guard
          config="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          printf '//npm.pkg.github.com/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" >> "${config}"
          npm publish --registry https://npm.pkg.github.com --access public

      - name: Pack release tarball
        run: |
          set -euo pipefail
          pnpm pack --pack-destination dist
          mv dist/*.tgz dist/dsh-sensitive-guard.tgz
          cd dist
          sha256sum dsh-sensitive-guard.tgz > SHA256SUMS

      - name: Upload assets to the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/dsh-sensitive-guard.tgz dist/SHA256SUMS --clobber
