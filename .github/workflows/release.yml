name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish GitHub Packages and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@gythialy'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Publish GitHub Packages
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack release tarball
        run: |
          set -euo pipefail
          pnpm pack --pack-destination dist
          mv dist/*.tgz dist/dsh-sensitive-guard.tgz
          cd dist
          sha256sum dsh-sensitive-guard.tgz > SHA256SUMS

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/dsh-sensitive-guard.tgz dist/SHA256SUMS --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
